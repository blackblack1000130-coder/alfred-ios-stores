<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda</title><style>:root{--accent:#f7c94b}body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1050px,94%);margin:auto}.top{padding:18px 0;border-bottom:1px solid #2d2618;display:flex;justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand span{color:var(--accent)}.hero{padding:28px 0}.hero h1{font-size:42px;margin:0 0 8px}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #332b1c;background:#0a0a0a;border-radius:16px;overflow:hidden}.pic{height:150px;background:#080808;display:grid;place-items:center}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:13px}.tag{color:var(--accent);font-size:10px;font-weight:900}.body h3{margin:7px 0}.price{font-weight:900;font-size:17px}.btn{display:inline-block;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent);color:#080808;text-decoration:none;font-weight:900;border:0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:31px}}</style></head><body><header class="top"><div class="wrap"><div class="brand" id="brand">Tienda</div><a class="btn" href="/cuenta-login.html" style="margin:0">Mi cuenta</a></div></header><main class="wrap"><section class="hero"><h1 id="title">Cargando…</h1><p class="muted">Productos disponibles en esta tienda.</p></section><div id="grid" class="grid"></div></main><script>const slug=location.pathname.split('/').filter(Boolean).pop();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function load(){try{const [s,p]=await Promise.all([fetch('/api/reseller/store/'+encodeURIComponent(slug)),fetch('/api/reseller/store/'+encodeURIComponent(slug)+'/products')]);if(!s.ok||!p.ok)throw Error('Tienda no disponible');const store=await s.json(),products=await p.json();document.documentElement.style.setProperty('--accent',store.store_color||'#f7c94b');document.title=store.store_name;$('brand').innerHTML=esc(store.store_name)+' <span>STORE</span>';$('title').textContent=store.store_name;$('grid').innerHTML=products.length?products.map(x=>`<article class="card"><div class="pic">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}">`:''}</div><div class="body"><div class="tag">${esc(x.category).toUpperCase()}</div><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description||'Producto digital')}</p><div class="price">US$${Number(x.price).toLocaleString('en-US')}</div><a class="btn" href="/revendedor-comprar.html?slug=${encodeURIComponent(store.slug)}&id=${x.id}">Comprar</a></div></article>`).join(''):'<p class="muted">Esta tienda todavía no tiene productos.</p>'}catch(e){$('title').textContent='Tienda no disponible';$('grid').innerHTML='<p class="muted">Esta tienda está vencida, suspendida o no existe.</p>'}}load();</script></body></html>
