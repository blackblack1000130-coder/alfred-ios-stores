<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALFRED IOS STORE</title><style>*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050505 url('/assets/alfred-ios-stores-luxury-bg.png') center top/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#000b;z-index:-1}.wrap{width:min(1180px,92%);margin:auto}.top{position:sticky;top:0;z-index:30;background:#050505e8;border-bottom:1px solid #5f461c;backdrop-filter:blur(18px)}.nav{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff}.apple{font-size:32px;color:var(--accent)}.logo{font-size:20px;font-weight:950}.logo span{display:block;color:var(--accent);font-size:10px;letter-spacing:3px}.nav-actions{display:flex;align-items:center;gap:8px}.nav-actions a{color:#fff;text-decoration:none;font-weight:900}.account{border:1px solid #6e5423;background:#090909e8;border-radius:12px;padding:8px 10px;font-size:18px}.section{padding:30px 0 25px}.titlebar{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:16px}.titlebar h1{margin:0;font-size:clamp(28px,5vw,42px)}.titlebar p{margin:5px 0 0;color:#999;font-size:13px}.titlebar a{color:var(--accent);text-decoration:none;font-weight:900}.cats{display:flex;gap:9px;overflow:auto;margin-bottom:20px}.cat{padding:10px 15px;border:1px solid #6d5221;border-radius:99px;background:#080808e8;color:#fff;white-space:nowrap;cursor:pointer;font-weight:900}.cat.active{background:var(--accent);color:#080808;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:#080a0de8;border:1px solid #303237;border-radius:17px;overflow:hidden;box-shadow:0 18px 45px #000a}.pic{height:155px;background:#050505;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.pic.empty{font-size:58px;color:var(--accent)}.body{padding:12px}.tag{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:1px}.body h3{font-size:15px;margin:7px 0}.desc{color:#999;font-size:12px;line-height:1.45;min-height:35px}.row{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:12px}.buy{padding:9px 11px;border-radius:10px;background:linear-gradient(135deg,#f8d15b,#d29a2d);color:#080808;text-decoration:none;font-size:11px;font-weight:950;border:0;cursor:pointer}.notice{margin-top:20px;padding:16px;border:1px solid #4c3a1b;border-radius:16px;background:#070707dd;color:#aaa;font-size:12px;line-height:1.6}.notice b{color:#fff}.bottom-back{display:block;width:max-content;margin:25px auto 15px;padding:10px 17px;border:1px solid #705522;border-radius:12px;color:#f7d36d;text-decoration:none;background:#090909e8;font-weight:900}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:9px}.pic{height:120px}.wrap{width:94%}}@media(max-width:450px){.logo{font-size:16px}.titlebar h1{font-size:28px}.body{padding:10px}.body h3{font-size:14px}.buy{padding:8px 9px}}</style></head><body><header class="top"><div class="wrap"><div class="nav"><a class="brand" href="#"><span class="apple"></span><span class="logo" id="brand">ALFRED<span>IOS STORE</span></span></a><div class="nav-actions"><a class="account" href="/cuenta-login.html">♙</a></div></div></div></header><main class="wrap"><section class="section"><div class="titlebar"><div><h1 id="title">Productos</h1><p>Compra directamente desde esta tienda.</p></div><a id="panelLink" href="/cuenta-login.html">Mi cuenta ›</a></div><div class="cats" id="cats"></div><div class="grid" id="grid"></div><div class="notice"><b>Compra y entrega:</b> el producto comprado queda registrado en tu cuenta. <br><b>Esta tienda pertenece a un revendedor independiente de ALFRED IOS STORE.</b></div><button class="bottom-back" type="button" onclick="goBack()">← Volver atrás</button></section></main><script>const slug=location.pathname.split('/').filter(Boolean).pop(),grid=document.getElementById('grid'),cats=document.getElementById('cats');let current=new URLSearchParams(location.search).get('category')||'';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function goBack(){if(history.length>1)history.back();else location.href='/'}async function api(u){const r=await fetch(u,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}async function load(){try{const store=await api('/api/reseller/store/'+encodeURIComponent(slug)),products=await api('/api/reseller/store/'+encodeURIComponent(slug)+'/products');document.documentElement.style.setProperty('--accent',store.store_color||'#f7c94b');document.title=store.store_name;document.getElementById('brand').textContent=store.store_name;document.getElementById('title').textContent=store.store_name;const names=[...new Set(products.map(x=>String(x.category||'Otros').trim()).filter(Boolean))];if(!current||!names.some(x=>x.toLowerCase()===current.toLowerCase()))current=names[0]||'';cats.innerHTML='<button class="cat '+(!current?'active':'')+'" data-cat="">Todas</button>'+names.map(c=>'<button class="cat '+(c.toLowerCase()===current.toLowerCase()?'active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');cats.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{current=b.dataset.cat;history.replaceState(null,'','/tienda/'+encodeURIComponent(slug)+(current?'?category='+encodeURIComponent(current):''));load()});const wanted=current.toLowerCase();const filtered=current?products.filter(x=>String(x.category||'').trim().toLowerCase()===wanted):products;grid.innerHTML=filtered.length?filtered.map(x=>'<article class="card"><div class="pic '+(x.image?'':'empty')+'">'+(x.image?'<img src="'+esc(x.image)+'?v='+x.id+'" alt="'+esc(x.name)+'" loading="lazy">':'')+'</div><div class="body"><div class="tag">'+esc(x.category||'PRODUCTO').toUpperCase()+'</div><h3>'+esc(x.name)+'</h3><div class="desc">'+esc(x.description||'Producto digital.')+'</div><div class="row"><strong>US$'+Number(x.price).toLocaleString('en-US')+'</strong><a class="buy" href="/revendedor-comprar.html?slug='+encodeURIComponent(store.slug)+'&id='+x.id+'">Comprar</a></div></div></article>').join(''):'<div class="notice">No hay productos disponibles.</div>'}catch(e){document.getElementById('title').textContent='Tienda no disponible';grid.innerHTML='<div class="notice">Esta tienda está vencida, suspendida o no existe.</div>'}}load();</script></body></html>
