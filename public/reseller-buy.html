<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprar</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(500px,94%);margin:40px auto}.card{border:1px solid #3b311f;background:#0b0b0b;border-radius:18px;padding:20px}.input{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 10px;background:#070707;color:#fff;border:1px solid #333;border-radius:10px}.btn{width:100%;border:0;border-radius:10px;padding:13px;background:#f7c94b;color:#080808;font-weight:900;cursor:pointer}.muted{color:#999;font-size:13px}.msg{color:#f7c94b;margin-top:12px;text-align:center}</style></head><body><main class="wrap"><div class="card"><div id="product">Cargando…</div><hr style="border-color:#292318;margin:18px 0"><h3>Inicia sesión para comprar</h3><input id="email" class="input" type="email" placeholder="Correo"><input id="pass" class="input" type="password" placeholder="Contraseña"><button id="buy" class="btn">Iniciar sesión y comprar</button><p class="muted">Si todavía no tienes cuenta, créala desde la tienda y vuelve aquí.</p><div id="msg" class="msg"></div></div></main><script>const q=new URLSearchParams(location.search),slug=q.get('slug')||'',id=Number(q.get('id'));const $=x=>document.getElementById(x);async function load(){try{const r=await fetch('/api/reseller/store/'+encodeURIComponent(slug)+'/products');const p=await r.json();const x=p.find(a=>a.id===id);if(!x)throw Error('Producto no encontrado');$('product').innerHTML='<h2>'+esc(x.name)+'</h2><p class="muted">'+esc(x.description||'Producto digital')+'</p><h2>US$'+Number(x.price).toLocaleString('en-US')+'</h2>'}catch(e){$('product').textContent=e.message}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}$('buy').onclick=async()=>{try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})}),j=await r.json();if(!r.ok)throw Error(j.error||'Credenciales incorrectas');r=await fetch('/api/reseller/buy/'+id,{method:'POST'});j=await r.json();if(!r.ok)throw Error(j.error||'No se pudo comprar');$('msg').textContent='✓ '+j.message;$('buy').textContent='Compra realizada'}catch(e){$('msg').textContent=e.message}};load();</script></body></html>
