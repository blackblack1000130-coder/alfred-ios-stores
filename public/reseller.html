<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de revendedor | ALFRED IOS STORE</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1050px,94%);margin:auto}.top{padding:18px 0;border-bottom:1px solid #332714}.top b{font-size:20px}.top span{color:#f7c94b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0b0b0b;border:1px solid #3d321e;border-radius:16px;padding:16px}.stat{font-size:12px;color:#999}.big{font-size:25px;font-weight:900;margin-top:5px}.input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;background:#070707;border:1px solid #353535;color:#fff;margin:6px 0 10px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;background:#f7c94b;color:#080808;cursor:pointer}.btn.dark{background:#17130b;color:#f7d36d;border:1px solid #59451f}.row{display:flex;gap:8px;flex-wrap:wrap}.table{display:grid;gap:8px}.item{padding:11px;border:1px solid #292318;border-radius:10px;background:#090909;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#929292;font-size:12px}.msg{margin-top:10px;color:#f7c94b;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><b>ALFRED <span>IOS STORE</span> · PANEL REVENDEDOR</b></div></header><main class="wrap" style="padding:20px 0 40px"><div id="login" class="card"><h2>Acceso de revendedor</h2><p class="muted">Usa el correo y contraseña de tu cuenta aprobada.</p><input id="email" class="input" type="email" placeholder="Correo"><input id="pass" class="input" type="password" placeholder="Contraseña"><button id="loginBtn" class="btn">Iniciar sesión</button><p id="loginMsg" class="msg"></p></div><div id="app" style="display:none"><div class="grid"><div class="card"><div class="stat">Estado</div><div id="status" class="big">—</div></div><div class="card"><div class="stat">Vencimiento</div><div id="expires" class="big">—</div></div><div class="card"><div class="stat">Tienda</div><div id="slug" class="big" style="font-size:16px">—</div></div></div><section class="card" style="margin-top:12px"><h3>🎨 Mi tienda</h3><label class="muted">Nombre</label><input id="storeName" class="input"><label class="muted">Color principal</label><input id="storeColor" class="input" type="color" value="#f7c94b" style="height:48px;padding:4px"><button class="btn" id="saveStore">Guardar cambios</button><a id="storeLink" class="btn dark" style="display:inline-block;text-decoration:none;margin-left:6px" target="_blank">🔗 Ver mi tienda</a><p id="storeMsg" class="msg"></p></section><section class="card" style="margin-top:12px"><h3>📦 Productos</h3><div class="card" style="background:#080808"><input id="pname" class="input" placeholder="Nombre del producto"><input id="pcat" class="input" placeholder="Categoría"><input id="pprice" class="input" type="number" min="0" placeholder="Precio US$"><input id="pdesc" class="input" placeholder="Descripción"><select id="pfile"><option value="">Sin archivo</option></select><button class="btn" id="addProduct">Agregar producto</button></div><div id="products" class="table" style="margin-top:12px"></div></section><section class="card" style="margin-top:12px"><h3>🗂️ Mis archivos</h3><input id="file" class="input" type="file" accept=".ipa,.zip,.rar,.7z,.pdf,.dmg"><button class="btn" id="upload">Subir archivo</button><div id="files" class="table" style="margin-top:12px"></div></section></div></main><script>const $=id=>document.getElementById(id);let me=null;async function api(u,o={}){const r=await fetch(u,o);const j=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok)throw Error(j.error||'Error');return j}async function boot(){try{me=await api('/api/reseller/me');$('login').style.display='none';$('app').style.display='block';renderMe();loadAll()}catch(e){}}function renderMe(){$('status').textContent='🟢 Activo';$('expires').textContent=new Date(me.reseller_expires_at).toLocaleDateString('es-DO');$('slug').textContent=me.reseller_slug;$('storeName').value=me.store_name||me.name;$('storeColor').value=me.store_color||'#f7c94b';$('storeLink').href='/tienda/'+encodeURIComponent(me.reseller_slug)}async function loadAll(){const [p,f]=await Promise.all([api('/api/reseller/products'),api('/api/reseller/files')]);$('products').innerHTML=p.length?p.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category)} · US$${x.price} ${x.file_name?'· '+esc(x.file_name):''}</div></div></div>`).join(''):'<div class="muted">No hay productos todavía.</div>';$('files').innerHTML=f.length?f.map(x=>`<div class="item"><div><b>${esc(x.original_name||x.name)}</b><div class="muted">${x.product_name?'Asignado a '+esc(x.product_name):'Sin asignar'}</div></div><a class="btn dark" href="${x.url}" target="_blank">Abrir</a></div>`).join(''):'<div class="muted">No hay archivos.</div>';$('pfile').innerHTML='<option value="">Sin archivo</option>'+f.map(x=>`<option value="${x.id}">${esc(x.original_name||x.name)}</option>`).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}$('loginBtn').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('pass').value})});location.reload()}catch(e){$('loginMsg').textContent=e.message}};$('saveStore').onclick=async()=>{try{await api('/api/reseller/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({store_name:$('storeName').value.trim(),store_color:$('storeColor').value})});me=await api('/api/reseller/me');renderMe();$('storeMsg').textContent='✓ Guardado'}catch(e){$('storeMsg').textContent=e.message}};$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return;$('upload').disabled=true;try{const fd=new FormData();fd.append('file',f);await api('/api/reseller/upload-file',{method:'POST',body:fd});$('file').value='';await loadAll()}catch(e){alert(e.message)}finally{$('upload').disabled=false}};$('addProduct').onclick=async()=>{try{await api('/api/reseller/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('pname').value.trim(),category:$('pcat').value.trim(),price:Number($('pprice').value),description:$('pdesc').value.trim(),file_id:Number($('pfile').value)||null})});$('pname').value='';$('pcat').value='';$('pprice').value='';$('pdesc').value='';await loadAll()}catch(e){alert(e.message)}};boot();</script></body></html>
