<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | ALFRED IOS STORES</title><style>body{margin:0;background:#05090f;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:22px}.box{background:#0e1823;border:1px solid #254761;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#07121d;padding:16px;border-radius:12px}input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#06101a;color:#fff;border:1px solid #2a4a61;border-radius:8px;box-sizing:border-box}button{padding:10px 13px;border:0;border-radius:8px;background:#0789ff;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#9b2538}.secondary{background:#38556b}.row{padding:13px 0;border-bottom:1px solid #20394d;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#96a8b7}.actions{display:flex;gap:7px;flex-wrap:wrap}.edit{background:#0b9d6a}.hidden{display:none}.card{background:#07121d;border:1px solid #20394d;border-radius:12px;padding:14px;margin:10px 0}.notice{padding:10px;border-radius:8px;background:#0b2638;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.actions button{width:100%}}</style></head><body><div class="wrap"><h1>ALFRED IOS STORES · ADMIN</h1><div id="loginbox" class="box"><form id="alog"><input id="ae" type="email" placeholder="Correo administrador" required><input id="ap" type="password" placeholder="Contraseña" required><button>Entrar</button></form><p id="am"></p></div><main id="app" class="hidden"><div id="stats" class="grid"></div><div class="box"><h2>Recargas</h2><div id="topups"></div></div><div class="box"><h2>Compras / entregas</h2><div id="purchases"></div></div><div class="box"><h2>Crear producto</h2><form id="np"><input name="name" placeholder="Nombre" required><select name="category"><option>Sensibilidades</option><option>Filza</option><option>3105</option><option>iMazing</option></select><input name="price" type="number" placeholder="Precio RD$" required><input name="image" placeholder="URL imagen"><input name="video" placeholder="URL video"><input name="mediafire_url" placeholder="URL MediaFire"><textarea name="description" placeholder="Descripción"></textarea><button>Crear producto</button></form></div><div class="box"><h2>Productos existentes</h2><div id="products"></div></div><div class="box"><h2>Clientes y saldo</h2><div id="users"></div></div></main></div><script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Error');return j}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const d=await api('/api/admin/data');$('loginbox').style.display='none';$('app').classList.remove('hidden');$('stats').innerHTML='<div class="stat">Clientes<br><b>'+d.users.length+'</b></div><div class="stat">Productos<br><b>'+d.products.length+'</b></div><div class="stat">Compras<br><b>'+d.purchases.length+'</b></div>';$('topups').innerHTML=d.topups.map(t=>'<div class="row"><span>'+esc(t.name)+' · RD$'+t.amount+'<br><span class="muted">'+esc(t.email)+' · '+esc(t.status)+' · <a href="'+esc(t.receipt)+'" target="_blank">Comprobante</a></span></span>'+(t.status==='pending'?'<span class="actions"><button onclick="approve('+t.id+')">Aprobar</button><button class="danger" onclick="rejectT('+t.id+')">Rechazar</button></span>':'')+'</div>').join('')||'<span class="muted">Sin recargas.</span>';$('purchases').innerHTML=d.purchases.map(x=>'<div class="row"><span>'+esc(x.name)+' → '+esc(x.product_name)+' · RD$'+x.price+'<br><span class="muted">'+esc(x.status)+'</span></span>'+(x.status!=='delivered'?'<button onclick="deliver('+x.id+')">Marcar entregado</button>':'')+'</div>').join('')||'<span class="muted">Sin compras.</span>';$('products').innerHTML=d.products.map(p=>productCard(p)).join('')||'<span class="muted">Sin productos.</span>';$('users').innerHTML=d.users.map(u=>'<div class="card"><b>'+esc(u.name)+'</b><br><span class="muted">'+esc(u.email)+'</span><br><strong>Saldo: RD$'+Number(u.balance).toFixed(2)+'</strong><div class="actions" style="margin-top:9px"><input id="bal-'+u.id+'" type="number" min="1" step="1" placeholder="Monto a agregar" style="max-width:220px"><input id="note-'+u.id+'" placeholder="Nota (opcional)" style="max-width:300px"><button onclick="addBalance('+u.id+')">+ Agregar saldo</button></div></div>').join('')||'<span class="muted">Sin clientes.</span>'}catch(e){$('am').textContent=e.message}}
function productCard(p){return '<div class="card"><div class="row" style="border:0"><span><b>'+esc(p.name)+'</b><br><span class="muted">'+esc(p.category)+' · RD$'+p.price+' · '+(p.active?'Activo':'Inactivo')+'</span></span><div class="actions"><button class="edit" onclick="toggleEdit('+p.id+')">✏️ Editar</button></div></div><div id="edit-'+p.id+'" class="hidden"><form onsubmit="saveProduct(event,'+p.id+')"><input name="name" value="'+esc(p.name)+'" placeholder="Nombre" required><select name="category"><option '+(p.category==='Sensibilidades'?'selected':'')+'>Sensibilidades</option><option '+(p.category==='Filza'?'selected':'')+'>Filza</option><option '+(p.category==='3105'?'selected':'')+'>3105</option><option '+(p.category==='iMazing'?'selected':'')+'>iMazing</option></select><input name="price" type="number" value="'+p.price+'" placeholder="Precio" required><input name="image" value="'+esc(p.image)+'" placeholder="URL imagen"><input name="video" value="'+esc(p.video)+'" placeholder="URL video"><input name="mediafire_url" value="'+esc(p.mediafire_url)+'" placeholder="URL MediaFire"><textarea name="description" placeholder="Descripción">'+esc(p.description)+'</textarea><label><input name="active" type="checkbox" '+(p.active?'checked':'')+'> Producto activo</label><div class="actions"><button class="edit">Guardar cambios</button><button type="button" class="secondary" onclick="toggleEdit('+p.id+')">Cancelar</button></div></form></div></div>'}
function toggleEdit(id){$('edit-'+id).classList.toggle('hidden')}
async function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f);body.active=e.target.elements.active.checked;try{await api('/api/admin/products/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Producto actualizado.');load()}catch(x){alert(x.message)}}
async function addBalance(id){const amount=Number($('bal-'+id).value);const note=$('note-'+id).value; if(!Number.isInteger(amount)||amount<1){alert('Escribe un monto entero mayor que 0.');return}try{await api('/api/admin/users/'+id+'/balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,note})});alert('Saldo agregado correctamente.');load()}catch(e){alert(e.message)}}
async function approve(id){await api('/api/admin/topup/'+id+'/approve',{method:'POST'});load()}async function rejectT(id){await api('/api/admin/topup/'+id+'/reject',{method:'POST'});load()}async function deliver(id){await api('/api/admin/purchase/'+id+'/deliver',{method:'POST'});load()}
$('alog').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('ae').value,password:$('ap').value})});$('am').textContent='';load()}catch(x){$('am').textContent=x.message}};
$('np').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData($('np'))))});$('np').reset();load()}catch(x){alert(x.message)}};
load();
</script></body></html>
