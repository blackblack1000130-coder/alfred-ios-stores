<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — ALFRED IOS STORES</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b18;color:#fff;font-family:Inter,system-ui,sans-serif}.layout{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:fixed;width:245px;top:0;bottom:0;background:#071225;border-right:1px solid #1b3b62;padding:24px 15px}.logo{font-weight:900;font-size:19px;padding:5px 12px 28px}.logo span{color:#39a9ff}.menu{display:grid;gap:7px}.menu button{text-align:left;background:transparent;color:#9eb5d0;border:1px solid transparent;padding:13px;border-radius:12px;font-weight:800}.menu button.active,.menu button:hover{background:#0e2949;color:#fff;border-color:#22558a}.content{grid-column:2;padding:28px 4%;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.title h1{margin:0}.muted{color:#8fa8c4}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,.panel,.product{background:#09172b;border:1px solid #1d416c;border-radius:17px;padding:18px}.stat b{font-size:30px;display:block;margin-top:7px}.section{display:none}.section.active{display:block}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product{padding:0;overflow:hidden}.pimg{height:155px;background:#0c2342;display:flex;align-items:center;justify-content:center}.pimg img{width:100%;height:100%;object-fit:cover}.pbody{padding:15px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.edit{background:#168cff;color:white}.toggle{background:#112a47;color:#c5dcf4}.list{display:grid;gap:10px}.row{background:#09172b;border:1px solid #1d416c;border-radius:13px;padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.row form{display:flex;gap:6px}.row input{width:110px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal.show{display:flex}.box{background:#09172b;border:1px solid #2b6096;border-radius:18px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}.box input,.box textarea,.box select{width:100%;padding:11px;margin:6px 0 12px;background:#071326;border:1px solid #294b70;color:#fff;border-radius:9px}.close{float:right;background:#18304d;color:white}.save{background:#168cff;color:#fff;width:100%}@media(max-width:1000px){.productgrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.layout{display:block}.side{position:sticky;width:100%;height:auto;z-index:10;padding:10px}.logo{padding:5px 10px 10px}.menu{display:flex;overflow:auto}.menu button{white-space:nowrap}.content{padding:18px 14px}.productgrid,.split,.stats{grid-template-columns:1fr 1fr}.stat b{font-size:24px}}@media(max-width:450px){.productgrid,.split,.stats{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}.row form{width:100%}}
</style></head>
<body>
<div class="layout"><aside class="side"><div class="logo">ALFRED <span>IOS STORES</span></div><nav class="menu">
<button class="active" onclick="show('home',this)">📊 Inicio</button><button onclick="show('products',this)">📦 Productos</button><button onclick="show('users',this)">👥 Clientes</button><button onclick="show('topups',this)">💳 Recargas</button><button onclick="show('orders',this)">🛒 Pedidos</button><button onclick="show('ledger',this)">📒 Movimientos</button><button onclick="location.href='/'">🌐 Ver tienda</button></nav></aside>
<main class="content"><div class="top"><div class="title"><h1 id="heading">Resumen</h1><div class="muted">Panel de control</div></div><button onclick="location.href='/'">Tienda</button></div>
<section id="home" class="section active"><div class="stats"><div class="stat">Clientes<b id="susers">0</b></div><div class="stat">Productos<b id="sproducts">0</b></div><div class="stat">Ventas<b id="ssales">0</b></div></div><div class="split"><div class="panel"><h3>💳 Recargas pendientes</h3><b id="stopups">0</b></div><div class="panel"><h3>🛒 Pedidos pendientes</h3><b id="sorders">0</b></div></div></section>
<section id="products" class="section"><div class="productgrid" id="productgrid"></div></section>
<section id="users" class="section"><div class="list" id="userslist"></div></section>
<section id="topups" class="section"><div class="list" id="topupslist"></div></section>
<section id="orders" class="section"><div class="list" id="orderslist"></div></section>
<section id="ledger" class="section"><div class="list" id="ledgerlist"></div></section>
</main></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">Cerrar</button><h2>Editar producto</h2><input id="eid" type="hidden"><label>Nombre</label><input id="ename"><label>Categoría</label><input id="ecat"><label>Precio</label><input id="eprice" type="number"><label>Imagen</label><input id="eimage"><label>Video</label><input id="evideo"><label>MediaFire</label><input id="emedia"><label>Descripción</label><textarea id="edesc" rows="4"></textarea><label><input id="eactive" type="checkbox" style="width:auto"> Activo</label><button class="save" onclick="saveProduct()">Guardar cambios</button></div></div>
<script>
let data={products:[],users:[],topups:[],purchases:[],ledger:[]};
async function api(url,opt={}){let r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{data=await api('/api/admin/data');draw()}catch(e){document.body.innerHTML='<div style="padding:40px;color:white">No autorizado. Inicia sesión como administrador.</div>'}}
function show(id,btn){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('heading').textContent=btn.textContent.replace(/^\\S+\\s/,'')}
function draw(){let p=data.products||[],u=data.users||[],t=data.topups||[],o=data.purchases||[],l=data.ledger||[];susers.textContent=u.length;sproducts.textContent=p.length;ssales.textContent=o.length;stopups.textContent=t.filter(x=>x.status==='pending').length;sorders.textContent=o.filter(x=>x.status!=='delivered').length;
productgrid.innerHTML=p.map(x=>`<article class="product"><div class="pimg">${x.image?`<img src="${x.image}">`:'📱'}</div><div class="pbody"><h3>${x.name}</h3><div class="muted">${x.category||''}</div><b>RD$${x.price}</b><div class="actions"><button class="edit" onclick="editProduct(${x.id})">✏️ Editar</button><button class="toggle" onclick="toggleProduct(${x.id},${x.active?0:1})">${x.active?'Desactivar':'Activar'}</button></div></div></article>`).join('');
userslist.innerHTML=u.map(x=>`<div class="row"><div><b>${x.email}</b><div class="muted">Saldo: RD$${x.balance}</div></div><form onsubmit="addBalance(event,${x.id})"><input type="number" min="1" placeholder="Monto"><button>+ Saldo</button></form></div>`).join('');
topupslist.innerHTML=t.map(x=>`<div class="row"><div><b>RD$${x.amount}</b><div class="muted">${x.email||''} · ${x.status}</div></div><div>${x.status==='pending'?`<button onclick="topup(${x.id},'approved')">Aprobar</button> <button onclick="topup(${x.id},'rejected')">Rechazar</button>`:''}</div></div>`).join('');
orderslist.innerHTML=o.map(x=>`<div class="row"><div><b>Pedido #${x.id}</b><div class="muted">${x.email||''} · RD$${x.amount} · ${x.status}</div></div>${x.status!=='delivered'?`<button onclick="deliver(${x.id})">Marcar entregado</button>`:''}</div>`).join('');
ledgerlist.innerHTML=l.map(x=>`<div class="row"><div><b>${x.type}</b><div class="muted">${x.email||''} · ${x.created_at||''}</div></div><b>RD$${x.amount}</b></div>`).join('')}
function editProduct(id){let x=data.products.find(p=>p.id===id);eid.value=x.id;ename.value=x.name||'';ecat.value=x.category||'';eprice.value=x.price||0;eimage.value=x.image||'';evideo.value=x.video||'';emedia.value=x.mediafire_url||'';edesc.value=x.description||'';eactive.checked=!!x.active;modal.classList.add('show')}
function closeModal(){modal.classList.remove('show')}
async function saveProduct(){await api('/api/admin/products/'+eid.value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:ename.value,category:ecat.value,price:Number(eprice.value),image:eimage.value,video:evideo.value,mediafire_url:emedia.value,description:edesc.value,active:eactive.checked?1:0})});closeModal();load()}
async function toggleProduct(id,active){await api('/api/admin/products/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({active})});load()}
async function addBalance(e,id){e.preventDefault();let n=e.target.querySelector('input').value;if(!n)return;await api('/api/admin/users/'+id+'/balance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number(n)})});load()}
async function topup(id,status){await api('/api/admin/topups/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
async function deliver(id){await api('/api/admin/purchases/'+id+'/deliver',{method:'POST'});load()}
load();
</script></body></html>
