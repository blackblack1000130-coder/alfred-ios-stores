<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | ALFRED IOS STORES</title><style>body{margin:0;background:#05090f;color:#fff;font-family:Arial}.wrap{max-width:1100px;margin:auto;padding:22px}.box{background:#0e1823;border:1px solid #254761;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#07121d;padding:16px;border-radius:12px}input,select,textarea{width:100%;padding:11px;margin:5px 0;background:#06101a;color:#fff;border:1px solid #2a4a61;border-radius:8px;box-sizing:border-box}button{padding:10px 13px;border:0;border-radius:8px;background:#0789ff;color:#fff;font-weight:bold}.danger{background:#9b2538}.row{padding:13px 0;border-bottom:1px solid #20394d;display:flex;justify-content:space-between;gap:10px}.muted{color:#96a8b7}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>ALFRED IOS STORES · ADMIN</h1><div id="loginbox" class="box"><form id="alog"><input id="ae" type="email" placeholder="Correo administrador" required><input id="ap" type="password" placeholder="Contraseña" required><button>Entrar</button></form><p id="am"></p></div><main id="app" style="display:none"><div id="stats" class="grid"></div><div class="box"><h2>Recargas</h2><div id="topups"></div></div><div class="box"><h2>Compras / entregas</h2><div id="purchases"></div></div><div class="box"><h2>Crear producto</h2><form id="np"><input name="name" placeholder="Nombre" required><select name="category"><option>Sensibilidades</option><option>Filza</option><option>3105</option><option>iMazing</option></select><input name="price" type="number" placeholder="Precio RD$" required><input name="image" placeholder="URL imagen"><input name="video" placeholder="URL video"><input name="mediafire_url" placeholder="URL MediaFire"><textarea name="description" placeholder="Descripción"></textarea><button>Crear producto</button></form></div><div class="box"><h2>Productos</h2><div id="products"></div></div><div class="box"><h2>Clientes</h2><div id="users"></div></div></main></div><script>
async function load(){let r=await fetch('/api/admin/data');if(!r.ok)return;let d=await r.json();loginbox.style.display='none';app.style.display='block';stats.innerHTML='<div class="stat">Clientes<br><b>'+d.users.length+'</b></div><div class="stat">Productos<br><b>'+d.products.length+'</b></div><div class="stat">Compras<br><b>'+d.purchases.length+'</b></div>';topups.innerHTML=d.topups.map(t=>'<div class="row"><span>'+t.name+' · RD$'+t.amount+'<br><span class="muted">'+t.email+' · '+t.status+' · <a href="'+t.receipt+'" target="_blank">Comprobante</a></span></span>'+(t.status==='pending'?'<span><button onclick="approve('+t.id+')">Aprobar</button> <button class="danger" onclick="rejectT('+t.id+')">Rechazar</button></span>':'')+'</div>').join('')||'<span class="muted">Sin recargas.</span>';purchases.innerHTML=d.purchases.map(x=>'<div class="row"><span>'+x.name+' → '+x.product_name+' · RD$'+x.price+'<br><span class="muted">'+x.status+'</span></span>'+(x.status!=='delivered'?'<button onclick="deliver('+x.id+')">Marcar entregado</button>':'')+'</div>').join('')||'<span class="muted">Sin compras.</span>';products.innerHTML=d.products.map(p=>'<div class="row"><span><b>'+p.name+'</b><br><span class="muted">'+p.category+' · RD$'+p.price+'</span></span></div>').join('');users.innerHTML=d.users.map(u=>'<div class="row"><span>'+u.name+'<br><span class="muted">'+u.email+'</span></span><b>RD$'+u.balance+'</b></div>').join('')}
async function approve(id){await fetch('/api/admin/topup/'+id+'/approve',{method:'POST'});load()}async function rejectT(id){await fetch('/api/admin/topup/'+id+'/reject',{method:'POST'});load()}async function deliver(id){await fetch('/api/admin/purchase/'+id+'/deliver',{method:'POST'});load()}
alog.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:ae.value,password:ap.value})}),j=await r.json();am.textContent=j.error||'';if(r.ok)load()};np.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(np)))});if(r.ok){np.reset();load()}else alert((await r.json()).error)};</script></body></html>
