<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta · ALFRED IOS STORES</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#123a62 0,#06101c 38%,#03070c 100%);color:#fff;font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(920px,92%);margin:auto;padding:18px 0 55px}.top{position:sticky;top:0;z-index:10;background:#03070cf0;backdrop-filter:blur(16px);border-bottom:1px solid #1d4c70}.topin{width:min(1050px,92%);margin:auto;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:1000}.brand span{color:#20baff}.top-actions{display:flex;gap:8px}.btn,.back{display:inline-flex;align-items:center;justify-content:center;padding:11px 14px;border:1px solid #29516e;border-radius:11px;background:#0a1a2a;color:#e4f7ff;text-decoration:none;font-weight:900;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#087eff,#00baff)}.btn.danger{background:#24121a;border-color:#6a3040;color:#ffc2cc}.hero{margin-top:16px;padding:20px;border:1px solid #28577b;border-radius:18px;background:linear-gradient(135deg,#0a2034e8,#07101de8);box-shadow:0 25px 70px #0008}.hero small{color:#63d6ff;font-weight:900;letter-spacing:1px}.hero h1{margin:8px 0;font-size:clamp(28px,6vw,46px)}.hero p{margin:0;color:#9db1c5}.balance{margin-top:14px;padding:14px;border-radius:18px;background:#04111d;border:1px solid #1e5c81}.balance label{color:#8ca8bd;font-size:13px}.balance strong{display:block;font-size:34px;color:#59d5ff;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.box{padding:15px;border:1px solid #1d4564;border-radius:15px;background:#071321e8;box-shadow:0 12px 35px #0005}.box h2{margin:0 0 6px;font-size:19px}.muted{color:#8fa6b9;line-height:1.5}input{width:100%;padding:12px;background:#04101b;color:#fff;border:1px solid #294c68;border-radius:10px;margin:5px 0 10px}.item{padding:10px 0;border-bottom:1px solid #17354d}.item:last-child{border-bottom:0}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#102c42;color:#9bdcff;font-size:12px;font-weight:900}.downloads{display:grid;gap:7px;margin-top:12px}.download{display:block;padding:9px 11px;border-radius:11px;background:#0a2136;border:1px solid #28516e;color:#cceeff;text-decoration:none;font-weight:900}.receipt-card{display:flex;align-items:center;gap:12px}.receipt-card img{width:75px;height:75px;object-fit:cover;border-radius:12px;border:1px solid #2a526f;cursor:zoom-in}.compat{margin-top:10px}.empty{padding:16px;border:1px dashed #29465d;border-radius:12px;color:#8299ac}.lightbox{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.lightbox.show{display:flex}.lightbox img{max-width:95vw;max-height:88vh;border-radius:14px}.lightbox button{position:absolute;right:16px;top:16px;padding:10px 14px;border:0;border-radius:10px;background:#19314a;color:#fff}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{width:94%}.topin{width:94%}.top-actions .back{display:inline-flex}.hero{padding:22px}.balance strong{font-size:34px}}
.bottom-back{border:1px solid #2b668b;cursor:pointer;font:inherit;display:block;width:max-content;margin:22px auto 30px;padding:11px 18px;border:1px solid #2b668b;border-radius:12px;color:#d9efff;text-decoration:none;background:#071a2a;font-weight:800}.support-box{margin-top:10px}.support-link{display:inline-block}</style></head><body>
<header class="top"><div class="topin"><div class="brand">ALFRED <span>IOS STORES</span></div><div class="top-actions"><button class="btn danger" id="logoutBtn">Cerrar sesión</button></div></div></header>
<main class="wrap"><section class="hero"><small>MI CUENTA</small><h1 id="hello">Cargando...</h1><p id="email"></p><div class="balance"><label>Saldo disponible</label><strong id="balance">US$0</strong></div></section>
<div class="grid"><section class="box"><h2>📱 Mi iPhone</h2><p class="muted">Guarda tu modelo y versión de iOS para consultar compatibilidad.</p><input id="iphoneModel" placeholder="Ej. iPhone 15 Pro"><input id="iosVersion" placeholder="Ej. 18.6.1 o 27.0.0 beta 6"><button class="btn primary" id="saveDevice">Guardar dispositivo</button><div id="deviceMsg" class="compat"></div></section>
<section class="box"><h2>💳 Agregar saldo</h2><p id="pay" class="muted"></p><form id="top"><input name="amount" type="number" min="1" placeholder="Monto US$" required><input name="receipt" type="file" accept="image/*,.pdf" required><button class="btn primary">Enviar comprobante</button></form><p id="m" class="muted"></p></section></div>
<section class="box" style="margin-top:16px"><h2>📦 Mis productos</h2><p class="muted">Después de una compra, aquí aparecerán tus archivos cuando estén listos.</p><div id="products"></div></section>
<section class="box" style="margin-top:16px"><h2>🧾 Mis comprobantes</h2><div id="tops"></div></section>
<button class="bottom-back" type="button" onclick="goBack()">← Volver atrás</button></main><div id="lightbox" class="lightbox" onclick="closeReceipt(event)"><button onclick="closeReceipt(event)">Cerrar</button><img id="bigReceipt" alt="Comprobante ampliado"></div>
<script>
function goBack(){if(history.length>1)history.back();else location.href='/'}const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function isImg(u){return /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(u||'')}function openReceipt(u){$('bigReceipt').src=u;$('lightbox').classList.add('show')}function closeReceipt(e){if(e)e.stopPropagation();$('lightbox').classList.remove('show')}
async function load(){const settings=await fetch('/api/settings',{cache:'no-store'}).then(x=>x.json()).catch(()=>({}));const r=await fetch('/api/me',{cache:'no-store'});if(!r.ok)return location.href='/cuenta-login.html';const u=await r.json();$('hello').textContent='Hola, '+u.name;$('email').textContent=u.email;$('balance').textContent='US$'+Number(u.balance||0).toLocaleString('en-US');$('iphoneModel').value=u.iphone_model||'';$('iosVersion').value=u.ios_version||'';renderCompatibility(u.compatibility);const s=await fetch('/api/settings').then(x=>x.json());$('pay').innerHTML='<b>Método:</b> '+esc(s.payment_method)+'<br><b>Dato:</b> '+esc(s.payment_account)+'<br>'+esc(s.delivery_notice);const p=await fetch('/api/my-products',{cache:'no-store'}).then(x=>x.json());$('products').innerHTML=p.length?p.map(x=>{const delivered=x.status==='delivered';return '<div class="item"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(x.name)+'</b><span class="status">'+esc(x.status)+'</span></div><div class="muted">'+esc(x.category)+' · US$'+Number(x.price).toLocaleString('en-US')+'</div>'+(delivered?'<div class="downloads">'+(x.file_url?'<a class="download" href="'+esc(x.file_url)+'" download>📦 '+esc(x.file_name||'Descargar archivo')+'</a>':'')+(x.ipa_url?'<a class="download" href="'+esc(x.ipa_url)+'" target="_blank" rel="noopener">📲 '+esc(x.ipa_name||'Descargar IPA')+'</a>':'')+(x.mega_url?'<a class="download" href="'+esc(x.mega_url)+'" target="_blank" rel="noopener">☁️ Descargar desde Mega</a>':'')+(x.mediafire_url?'<a class="download" href="'+esc(x.mediafire_url)+'" target="_blank" rel="noopener">📥 Enlace alternativo</a>':'')+(x.file_password?'<div class="download">🔐 Contraseña: <code>'+esc(x.file_password)+'</code></div>':'')+((x.file_url||x.ipa_url||x.mega_url||x.mediafire_url)?'<div class="support-box"><a class="download support-link" href="'+esc(settings.whatsapp_support||'https://wa.me/message/YXZINHSERCDNP1')+'" target="_blank" rel="noopener">💬 Soporte por WhatsApp</a></div>':'')+'</div>':'<div class="muted" style="margin-top:10px">⏳ Tu compra está registrada. Tus archivos te esperarán aquí en cuanto el pedido sea entregado.</div>')+'</div>'}).join(''):'<div class="empty">Todavía no tienes compras.</div>';const t=await fetch('/api/my-topups',{cache:'no-store'}).then(x=>x.json());$('tops').innerHTML=t.length?t.map(x=>'<div class="item receipt-card">'+(x.receipt&&isImg(x.receipt)?'<img src="'+esc(x.receipt)+'" onclick="openReceipt(\''+esc(x.receipt)+'\')" alt="Comprobante">':'<div style="font-size:32px">🧾</div>')+'<div><b>US$'+Number(x.amount).toLocaleString('en-US')+'</b><div class="muted">'+esc(x.status)+' · '+esc(x.created_at)+'</div>'+(x.receipt&&!isImg(x.receipt)?'<a class="download" href="'+esc(x.receipt)+'" target="_blank">Abrir comprobante</a>':'')+'</div></div>').join(''):'<div class="empty">No hay comprobantes todavía.</div>'}
function renderCompatibility(c){const el=$('deviceMsg');if(!c){el.textContent='';return}if(c.compatible===true)el.innerHTML='<b style="color:#4ade80">✅ Compatible</b> · '+esc(c.label||'');else if(c.compatible===false)el.innerHTML='<b style="color:#ff6b6b">❌ No compatible</b> · '+esc(c.label||'');else el.innerHTML='<span class="muted">ℹ️ '+esc(c.message||'Versión no configurada')+'</span>'}
$('saveDevice').onclick=async()=>{const msg=$('deviceMsg');msg.textContent='Guardando...';const r=await fetch('/api/my-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({iphone_model:$('iphoneModel').value,ios_version:$('iosVersion').value})});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Error';return}renderCompatibility(j.compatibility)};
$('top').onsubmit=async e=>{e.preventDefault();$('m').textContent='Enviando comprobante...';const r=await fetch('/api/topup',{method:'POST',body:new FormData(e.target)});const j=await r.json();$('m').textContent=j.error||j.message;if(r.ok)e.target.reset();load()};$('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/'};load();setInterval(load,30000);
</script></body></html>
