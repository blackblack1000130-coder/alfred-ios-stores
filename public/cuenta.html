<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta</title><style>body{margin:0;background:#040910;color:white;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:25px}.box{background:#0d1722;border:1px solid #23445d;border-radius:17px;padding:20px;margin:15px 0}.bal{font-size:38px;color:#45c6ff;font-weight:900}input{padding:12px;background:#06101a;color:white;border:1px solid #294b62;border-radius:9px;margin:5px 0}.btn{padding:11px 15px;border:0;border-radius:9px;background:#0789ff;color:#fff;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #20394d}.muted{color:#95a8b8}</style></head><body><div class="wrap"><h1>Mi cuenta</h1><div id="me" class="box">Cargando...</div><div class="box"><h2>📱 Mi iPhone</h2><p class="muted">Indica el modelo y la versión exacta de iOS para consultar la compatibilidad.</p><input id="iphoneModel" type="text" placeholder="Ej. iPhone 15 Pro"><br><input id="iosVersion" type="text" placeholder="Ej. 18.6.1 o 27.0.0 beta 6"><br><button class="btn" id="saveDevice">Guardar mi iPhone</button><div id="deviceMsg" style="margin-top:12px"></div></div><div class="box"><h2>Agregar saldo</h2><p id="pay" class="muted"></p><form id="top"><input name="amount" type="number" min="1" placeholder="Monto US$" required><br><input name="receipt" type="file" accept="image/*,.pdf" required><br><button class="btn">Enviar comprobante</button></form><p id="m"></p></div><div class="box"><h2>Mis productos</h2><div id="products"></div></div><div class="box"><h2>Mis comprobantes</h2><div id="tops"></div></div><button class="btn" id="logoutBtn" style="margin-right:8px">Cerrar sesión</button><a href="/" style="color:#55c7ff">← Volver a la tienda</a></div><script>
async function load(){
 const r=await fetch('/api/me'); if(!r.ok)return location.href='/cuenta-login.html';
 const u=await r.json(); document.getElementById('me').innerHTML='<b>'+esc(u.name)+'</b><p>'+esc(u.email)+'</p><div class="bal">US$'+Number(u.balance).toLocaleString('en-US')+'</div>'; document.getElementById('iphoneModel').value=u.iphone_model||''; document.getElementById('iosVersion').value=u.ios_version||''; renderCompatibility(u.compatibility);
 const s=await fetch('/api/settings').then(x=>x.json()); document.getElementById('pay').innerHTML='<b>Método:</b> '+esc(s.payment_method)+'<br><b>Dato:</b> '+esc(s.payment_account)+'<br>'+esc(s.delivery_notice);
 const p=await fetch('/api/my-products',{cache:'no-store'}).then(x=>x.json());
 document.getElementById('products').innerHTML=p.length?p.map(x=>{
   const delivered=x.status==='delivered';
   return '<div class="item"><b>'+esc(x.name)+'</b><div class="muted">Categoría: '+esc(x.category)+' · Estado: '+esc(x.status)+'</div>'+
   (delivered ? '<div style="margin-top:8px;color:#8fdcff">📲 La IPA entregada corresponde únicamente a la categoría '+esc(x.category)+'.</div>' : '')+
   (delivered ?
    '<div style="margin-top:10px;display:grid;gap:8px">'+
      (x.mega_url?'<a class="btn" href="'+esc(x.mega_url)+'" target="_blank" rel="noopener">📦 Descargar archivo de Mega</a>':'')+
      (x.file_password?'<div style="background:#06101a;border:1px solid #294b62;padding:12px;border-radius:9px"><b>🔐 Contraseña:</b> <code>'+esc(x.file_password)+'</code></div>':'')+
      (x.ipa_url?'<a class="btn" href="'+esc(x.ipa_url)+'" target="_blank" rel="noopener">📲 Descargar '+esc(x.ipa_name||('IPA '+x.category))+'</a>':'')+
      (x.mediafire_url?'<a class="btn" href="'+esc(x.mediafire_url)+'" target="_blank" rel="noopener">📥 Descargar enlace alternativo</a>':'')+
    '</div>' : '<br><span class="muted">Pendiente de entrega. Las descargas y la contraseña aparecerán cuando el pedido sea marcado como entregado.</span>')+'</div>'
 }).join(''):'<span class="muted">No tienes compras todavía.</span>';
 const t=await fetch('/api/my-topups').then(x=>x.json()); document.getElementById('tops').innerHTML=t.length?t.map(x=>'<div class="item"><b>US$'+Number(x.amount).toLocaleString('en-US')+'</b> · '+esc(x.status)+' · '+esc(x.created_at)+'</div>').join(''):'<span class="muted">No hay comprobantes.</span>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderCompatibility(c){const el=document.getElementById('deviceMsg');if(!c){el.textContent='';return} if(c.compatible===true)el.innerHTML='<b style="color:#4ade80">✅ Compatible</b> · '+esc(c.label||''); else if(c.compatible===false)el.innerHTML='<b style="color:#ff6b6b">❌ No compatible</b> · '+esc(c.label||''); else el.innerHTML='<span class="muted">ℹ️ '+esc(c.message||'Versión no configurada')+'</span>'}
document.getElementById('saveDevice').onclick=async()=>{const msg=document.getElementById('deviceMsg');msg.textContent='Guardando...';const r=await fetch('/api/my-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({iphone_model:document.getElementById('iphoneModel').value,ios_version:document.getElementById('iosVersion').value})});const j=await r.json();if(!r.ok){msg.textContent=j.error||'Error';return}renderCompatibility(j.compatibility);msg.innerHTML='<b style="color:#4ade80">Guardado.</b> '+(j.compatibility.compatible===true?'✅ Compatible':j.compatibility.compatible===false?'❌ No compatible':'ℹ️ '+esc(j.compatibility.message||''));};
document.getElementById('top').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/topup',{method:'POST',body:new FormData(e.target)}),j=await r.json();document.getElementById('m').textContent=j.error||j.message;load()};
document.getElementById('logoutBtn').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/'};
load();setInterval(load,30000);
</script></body></html>
