<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta</title><style>body{margin:0;background:#040910;color:white;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:25px}.box{background:#0d1722;border:1px solid #23445d;border-radius:17px;padding:20px;margin:15px 0}.bal{font-size:38px;color:#45c6ff;font-weight:900}input{padding:12px;background:#06101a;color:white;border:1px solid #294b62;border-radius:9px;margin:5px 0}.btn{padding:11px 15px;border:0;border-radius:9px;background:#0789ff;color:#fff;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #20394d}.muted{color:#95a8b8}</style></head><body><div class="wrap"><h1>Mi cuenta</h1><div id="me" class="box">Cargando...</div><div class="box"><h2>📱 Mi iPhone</h2><p class="muted">Indica el modelo y la versión exacta de iOS que tienes para comprobar compatibilidad.</p><form id="deviceForm"><input id="iphoneModel" type="text" placeholder="Modelo, por ejemplo iPhone 15 Pro" required><br><input id="iosVersion" type="text" list="iosVersions" placeholder="Versión exacta, por ejemplo 18.6.1 o 27.0.0 beta 6" required><datalist id="iosVersions"><option value="14.0.0"><option value="18.6.1"><option value="18.7.1"><option value="18.7.10"><option value="26.0.1"><option value="26.6.2"><option value="27.0.0 beta 1"><option value="27.0.0 beta 2"><option value="27.0.0 beta 3"><option value="27.0.0 beta 4"><option value="27.0.0 beta 5"><option value="27.0.0 beta 6"></datalist><br><button class="btn">Guardar iPhone</button></form><p id="deviceMsg"></p><div id="compatibilityBox" class="item" style="margin-top:12px"></div></div><div class="box"><h2>Agregar saldo</h2><p id="pay" class="muted"></p><form id="top"><input name="amount" type="number" min="1" placeholder="Monto RD$" required><br><input name="receipt" type="file" accept="image/*,.pdf" required><br><button class="btn">Enviar comprobante</button></form><p id="m"></p></div><div class="box"><h2>Mis productos</h2><div id="products"></div></div><div class="box"><h2>Mis comprobantes</h2><div id="tops"></div></div><a href="/" style="color:#55c7ff">← Volver a la tienda</a></div><script>
function parseVersion(v){v=String(v||'').trim().toLowerCase().replace(/\s+/g,' ');let beta=0,m=v.match(/(\d+(?:\.\d+){0,2})\s*(?:beta\s*(\d+))?/);if(!m)return null;let a=m[1].split('.').map(Number);while(a.length<3)a.push(0);return [a[0],a[1],a[2],m[2]?Number(m[2]):999];}
function cmp(a,b){for(let i=0;i<4;i++){if(a[i]!==b[i])return a[i]-b[i]}return 0}
function inRange(v,r){let parts=r.split('-').map(x=>x.trim());if(parts.length!==2)return cmp(v,parseVersion(parts[0]))===0;let lo=parseVersion(parts[0]),hi=parseVersion(parts[1]);return lo&&hi&&cmp(v,lo)>=0&&cmp(v,hi)<=0}
function compatible(v,settings){let pv=parseVersion(v);if(!pv)return false;let blocked=String(settings.blocked_ranges||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(blocked.some(r=>inRange(pv,r)))return false;let allowed=String(settings.allowed_ranges||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);return allowed.some(r=>inRange(pv,r));}
async function checkCompatibility(){let v=document.getElementById('iosVersion').value;let s=await fetch('/api/compatibility',{cache:'no-store'}).then(x=>x.json());let ok=compatible(v,s);document.getElementById('compatibilityBox').innerHTML=ok?'<b style="color:#55e39a">✅ Compatible</b><div class="muted">'+esc(s.note||'')+'</div>':'<b style="color:#ff7777">❌ No compatible</b><div class="muted">'+esc(s.note||'')+'</div>';}
async function load(){
 const r=await fetch('/api/me'); if(!r.ok)return location.href='/cuenta-login.html';
 const u=await r.json(); document.getElementById('me').innerHTML='<b>'+esc(u.name)+'</b><p>'+esc(u.email)+'</p><div class="bal">RD$'+Number(u.balance).toLocaleString('es-DO')+'</div>'; document.getElementById('iphoneModel').value=u.iphone_model||''; document.getElementById('iosVersion').value=u.ios_version||'';
 const s=await fetch('/api/settings').then(x=>x.json()); document.getElementById('pay').innerHTML='<b>Método:</b> '+esc(s.payment_method)+'<br><b>Dato:</b> '+esc(s.payment_account)+'<br>'+esc(s.delivery_notice);
 const p=await fetch('/api/my-products',{cache:'no-store'}).then(x=>x.json());
 document.getElementById('products').innerHTML=p.length?p.map(x=>{
   const delivered=x.status==='delivered';
   return '<div class="item"><b>'+esc(x.name)+'</b><div class="muted">Categoría: '+esc(x.category)+' · Estado: '+esc(x.status)+'</div>'+
   (delivered ?
    '<div style="margin-top:10px;display:grid;gap:8px">'+
      (x.mega_url?'<a class="btn" href="'+esc(x.mega_url)+'" target="_blank" rel="noopener">📦 Descargar archivo de Mega</a>':'')+
      (x.file_password?'<div style="background:#06101a;border:1px solid #294b62;padding:12px;border-radius:9px"><b>🔐 Contraseña:</b> <code>'+esc(x.file_password)+'</code></div>':'')+
      (x.ipa_url?'<a class="btn" href="'+esc(x.ipa_url)+'" target="_blank" rel="noopener">📲 Descargar IPA de '+esc(x.category)+'</a>':'')+
      (x.mediafire_url?'<a class="btn" href="'+esc(x.mediafire_url)+'" target="_blank" rel="noopener">📥 Descargar enlace alternativo</a>':'')+
    '</div>' : '<br><span class="muted">Pendiente de entrega. Las descargas y la contraseña aparecerán cuando el pedido sea marcado como entregado.</span>')+'</div>'
 }).join(''):'<span class="muted">No tienes compras todavía.</span>';
 const t=await fetch('/api/my-topups').then(x=>x.json()); document.getElementById('tops').innerHTML=t.length?t.map(x=>'<div class="item">RD$'+x.amount+' · '+esc(x.status)+' · '+esc(x.created_at)+'</div>').join(''):'<span class="muted">No hay comprobantes.</span>';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('top').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/topup',{method:'POST',body:new FormData(e.target)}),j=await r.json();document.getElementById('m').textContent=j.error||j.message;load()};
document.getElementById('deviceForm').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/my-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({iphone_model:document.getElementById('iphoneModel').value,ios_version:document.getElementById('iosVersion').value})});let j=await r.json();document.getElementById('deviceMsg').textContent=j.error||'✓ Datos guardados';if(r.ok)checkCompatibility()};document.getElementById('iosVersion').addEventListener('input',checkCompatibility);load();setInterval(load,30000);
</script></body></html>
