<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta</title><style>body{margin:0;background:#040910;color:white;font-family:Arial}.wrap{max-width:1000px;margin:auto;padding:25px}.box{background:#0d1722;border:1px solid #23445d;border-radius:17px;padding:20px;margin:15px 0}.bal{font-size:38px;color:#45c6ff;font-weight:900}input{padding:12px;background:#06101a;color:white;border:1px solid #294b62;border-radius:9px;margin:5px 0}.btn{padding:11px 15px;border:0;border-radius:9px;background:#0789ff;color:#fff;font-weight:bold}.item{padding:14px 0;border-bottom:1px solid #20394d}.muted{color:#95a8b8}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1>Mi cuenta</h1><a href="/" style="color:#55c7ff;text-decoration:none;font-weight:bold">← Tienda</a></div><div id="me" class="box">Cargando...</div><div class="box"><h2>Agregar saldo</h2><p id="pay" class="muted"></p><form id="top"><input name="amount" type="number" min="1" placeholder="Monto RD$" required><br><input name="receipt" type="file" accept="image/*,.pdf" required><br><button class="btn">Enviar comprobante</button></form><p id="m"></p></div><div class="box"><h2>Mis productos</h2><div id="products"></div></div><div class="box"><h2>Mis comprobantes</h2><div id="tops"></div></div><a href="/" style="color:#55c7ff">← Volver a la tienda</a></div><script>async function load(){let r=await fetch('/api/me');if(!r.ok)return location.href='/cuenta-login.html';let u=await r.json();me.innerHTML='<b>'+u.name+'</b><p>'+u.email+'</p><div class="bal">RD$'+Number(u.balance||0).toLocaleString('es-DO')+'</div><p class="muted">Tu saldo se actualiza automáticamente.</p>';let s=await fetch('/api/settings').then(x=>x.json());pay='<b>Método:</b> '+s.payment_method+'<br><b>Dato:</b> '+s.payment_account+'<br>'+s.delivery_notice;let p=await fetch('/api/my-products').then(x=>x.json());products.innerHTML=p.length?p.map(x=>'<div class="item"><b>'+x.name+'</b><br><span class="muted">Estado: '+x.status+'</span>'+(x.status==='delivered'&&x.mediafire_url?'<br><a href="'+x.mediafire_url+'" target="_blank" style="color:#4ec8ff">📥 Descargar</a>':'<br><span class="muted">Pendiente de entrega.</span>')+'</div>').join(''):'<span class="muted">No tienes compras todavía.</span>';let t=await fetch('/api/my-topups').then(x=>x.json());tops.innerHTML=t.length?t.map(x=>'<div class="item">RD$'+x.amount+' · '+x.status+' · '+x.created_at+'</div>').join(''):'<span class="muted">No hay comprobantes.</span>'}top.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/topup',{method:'POST',body:new FormData(top)}),j=await r.json();m.textContent=j.error||j.message;load()};load()</script></body></html>
