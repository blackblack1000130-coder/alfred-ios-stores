<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrito · ALFRED IOS STORE</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#050505 url('/assets/alfred-ios-stores-luxury-bg.png') center top/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:#000b;z-index:-1}.wrap{width:min(760px,92%);margin:auto}.top{position:sticky;top:0;z-index:20;background:#050505ed;border-bottom:1px solid #5f461c}.nav{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;font-size:19px}.brand span{color:#f7c94b}.back{color:#f7d36d;text-decoration:none;border:1px solid #705522;background:#090909;padding:8px 11px;border-radius:10px;font-weight:900;font-size:12px}.greeting{margin:12px 0 0;color:#ddd;font-weight:800;font-size:13px}.balancebox{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid #6e5423;border-radius:13px;background:#090909e8;margin:10px 0;color:#aaa}.balancebox b{color:#f7c94b;font-size:19px}.box{margin:12px 0;padding:14px;border:1px solid #4a391d;border-radius:16px;background:#090a0ce8}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #302717}.item:last-child{border-bottom:0}.thumb{width:58px;height:58px;border-radius:10px;overflow:hidden;background:#050505;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.name{font-weight:900}.muted{color:#999;font-size:12px}.remove{margin-left:auto;background:#21130f;color:#f0c8b0;border:1px solid #63352b;border-radius:8px;padding:7px 9px}.total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-weight:900}.total b{font-size:22px;color:#f7c94b}.buy{width:100%;margin-top:12px;padding:12px;border:0;border-radius:11px;background:linear-gradient(135deg,#f8d15b,#d29a2d);font-weight:950;font-size:15px}.buy:disabled{opacity:.6}.empty{text-align:center;padding:30px;color:#999}.msg{margin-top:10px;color:#f0c86a;font-size:12px}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #0005;border-top-color:#111;border-radius:50%;vertical-align:-3px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><header class="top"><div class="wrap"><div class="nav"><div class="brand">ALFRED <span>IOS STORE</span></div><a class="back" href="/store-index.html">← Seguir comprando</a></div></div></header><main class="wrap"><div id="greeting" class="greeting"></div><div class="balancebox"><span>💰 Saldo disponible</span><b id="balance">US$0.00</b></div><section class="box"><h2 style="margin:0 0 8px">🛒 Mi carrito</h2><div id="items">Cargando...</div><div id="summary"></div><div id="msg" class="msg"></div></section><a class="back" href="/" style="display:block;width:max-content;margin:0 auto 25px">← Volver al inicio</a></main><script>(async()=>{try{const s=await fetch('/api/settings',{cache:'no-store'}).then(r=>r.json());if(s.main_background)document.body.style.backgroundImage='url('+JSON.stringify(s.main_background)+')';}catch(e){}})();</script><script>
const itemsEl=document.getElementById('items'),summary=document.getElementById('summary'),msg=document.getElementById('msg');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function getCart(){return JSON.parse(localStorage.getItem('alfred_cart')||'[]').map(Number).filter(Number.isInteger)}function clearCart(){localStorage.removeItem('alfred_cart')}
async function load(){const mr=await fetch('/api/me',{cache:'no-store'});if(!mr.ok){location.href='/cuenta-login.html';return}const u=await mr.json();document.getElementById('greeting').textContent='Hola, '+u.name+' 👋';document.getElementById('balance').textContent='US$'+Number(u.balance||0).toLocaleString('en-US',{minimumFractionDigits:2});const ids=getCart();if(!ids.length){itemsEl.innerHTML='<div class="empty">Tu carrito está vacío.<br><a class="back" href="/store-index.html" style="display:inline-block;margin-top:12px">Ver productos</a></div>';summary.innerHTML='';return}const all=await fetch('/api/products?_='+Date.now(),{cache:'no-store'}).then(r=>r.json());const products=ids.map(id=>all.find(x=>Number(x.id)===id)).filter(Boolean);itemsEl.innerHTML=products.length?products.map(x=>`<div class="item"><div class="thumb">${x.image?`<img src="${esc(x.image)}?v=${x.id}" alt="${esc(x.name)}">`:''}</div><div><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.category||'Producto')}</div><b>US$${Number(x.price).toLocaleString('en-US')}</b></div><button class="remove" data-id="${x.id}">Quitar</button></div>`).join(''):'<div class="empty">Los productos del carrito ya no están disponibles.</div>';const total=products.reduce((n,x)=>n+Number(x.price||0),0);summary.innerHTML=products.length?`<div class="total"><span>Total</span><b>US$${total.toLocaleString('en-US')}</b></div><button id="confirm" class="buy">Confirmar compra</button>`:'';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{const c=getCart().filter(id=>id!==Number(b.dataset.id));localStorage.setItem('alfred_cart',JSON.stringify(c));load()});const confirm=document.getElementById('confirm');if(confirm)confirm.onclick=async()=>{confirm.disabled=true;confirm.innerHTML='<span class="spinner"></span> Procesando...';msg.textContent='';try{const r=await fetch('/api/buy-cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productIds:products.map(x=>x.id)})});const j=await r.json();if(r.status===401){location.href='/cuenta-login.html';return}if(!r.ok){msg.textContent=j.error||'No se pudo completar la compra.';confirm.disabled=false;confirm.textContent='Confirmar compra';return}clearCart();location.href='/cuenta.html'}catch(e){msg.textContent='No se pudo conectar con el servidor.';confirm.disabled=false;confirm.textContent='Confirmar compra'}}}
load();</script></body></html>
