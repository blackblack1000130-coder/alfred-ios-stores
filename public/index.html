<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALFRED IOS STORES</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#fff;background:#050b18;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#123b73 0,transparent 35%),radial-gradient(circle at 90% 20%,#071e48 0,transparent 40%),linear-gradient(135deg,#030711,#081a35);z-index:-1}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);background:#050b18cc;border-bottom:1px solid #1e3d66;padding:16px 5%}
.nav{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;font-size:20px;letter-spacing:1px}.brand span{color:#39a9ff}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.account{background:#168cff;color:#fff}
main{max-width:1400px;margin:auto;padding:35px 5% 70px}.hero{padding:35px 0}.hero h1{font-size:clamp(34px,6vw,68px);margin:0 0 12px}.hero p{color:#b9c9df;max-width:700px;font-size:17px}.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.pill{padding:9px 13px;border:1px solid #23528a;border-radius:999px;background:#0b1b33cc;color:#d9ecff}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:220px;padding:14px;border-radius:12px;border:1px solid #26496f;background:#071326;color:#fff}.cats{display:flex;gap:8px;flex-wrap:wrap}.cats button{background:#0c1d35;color:#bcd2eb;border:1px solid #24486f}.cats button.active{background:#168cff;color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:#09172bd9;border:1px solid #1d416c;border-radius:18px;overflow:hidden;box-shadow:0 15px 45px #0005}.media{height:190px;background:#0b203d;display:flex;align-items:center;justify-content:center;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.body h3{margin:0 0 7px}.desc{color:#9fb4cd;min-height:42px;font-size:14px}.price{font-size:23px;font-weight:900;margin:12px 0}.actions{display:flex;gap:8px}.buy{background:#168cff;color:white;flex:1}.video{background:#102945;color:#bfe2ff}.empty{text-align:center;color:#9fb4cd;padding:50px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.media{height:150px}.body{padding:12px}.actions{flex-direction:column}}@media(max-width:480px){main{padding-left:14px;padding-right:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:20px}.hero p{font-size:15px}.brand{font-size:17px}}
</style></head>
<body>
<header><div class="nav"><div class="brand">ALFRED <span>IOS STORES</span></div><button class="account" onclick="location.href='/cuenta.html'">Mi cuenta</button></div></header>
<main>
<section class="hero"><h1>Tu tienda <span style="color:#39a9ff">iPhone</span> digital</h1><p>Compra tus productos de forma rápida y sencilla. Recibe tu pedido en un plazo estimado de 1 a 2 horas.</p><div class="pills"><span class="pill">⚡ Entrega 1–2 horas</span><span class="pill">📱 iOS 14–27</span><span class="pill">💳 Compra con saldo</span></div></section>
<div class="toolbar"><input id="search" class="search" placeholder="Buscar producto..."><div id="cats" class="cats"></div></div>
<section id="grid" class="grid"></section>
</main>
<script>
let products=[],cat='Todos';
async function load(){let r=await fetch('/api/products');products=await r.json();renderCats();render()}
function renderCats(){let cs=['Todos',...new Set(products.map(p=>p.category).filter(Boolean))];document.querySelector('#cats').innerHTML=cs.map(x=>`<button class="${x===cat?'active':''}" onclick="cat='${x.replace(/'/g,"\\'")}';renderCats();render()">${x}</button>`).join('')}
function render(){let q=document.querySelector('#search').value.toLowerCase();let a=products.filter(p=>p.active!==0&&p.active!==false&&(cat==='Todos'||p.category===cat)&&(`${p.name} ${p.description||''}`.toLowerCase().includes(q)));document.querySelector('#grid').innerHTML=a.length?a.map(p=>`<article class="card"><div class="media">${p.image?`<img src="${p.image}" alt="">`:'📱'}</div><div class="body"><h3>${p.name}</h3><div class="desc">${p.description||''}</div><div class="price">RD$${Number(p.price).toFixed(0)}</div><div class="actions">${p.video?`<button class="video" onclick="window.open('${p.video}','_blank')">▶ Video</button>`:''}<button class="buy" onclick="location.href='/compra.html?id=${p.id}'">Comprar</button></div></div></article>`).join(''):'<div class="empty">No encontramos productos.</div>'}
document.querySelector('#search').addEventListener('input',render);load();
</script></body></html>
