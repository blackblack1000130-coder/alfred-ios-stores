<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprar</title><style>body{margin:0;background:#040910;color:#fff;font-family:Arial}.box{max-width:600px;margin:60px auto;padding:25px;background:#0d1722;border:1px solid #23445d;border-radius:18px}.price{font-size:35px;color:#46c7ff;font-weight:900}button{padding:13px 18px;border:0;border-radius:10px;background:#0789ff;color:#fff;font-weight:bold}.muted{color:#99aabb}</style></head><body><div class="box"><h1>Confirmar compra</h1><div id="p">Cargando...</div><button id="buy">Comprar con mi saldo</button><p id="m"></p><a href="/" style="color:#55c7ff">← Tienda</a></div><script>const id=new URLSearchParams(location.search).get('product') || new URLSearchParams(location.search).get('id');async function load(){let p=await fetch('/api/products').then(r=>r.json());let x=p.find(a=>String(a.id)===String(id));if(!x)return pEl();pEl.innerHTML='<h2>'+x.name+'</h2><p class="muted">'+(x.description||'')+'</p><div class="price">US$'+Number(x.price).toLocaleString('en-US')+'</div><p class="muted">Después de comprar, la entrega puede tardar de 1 a 2 horas.</p>'}function pEl(){p.innerHTML='Producto no encontrado.'}buy.onclick=async()=>{let r=await fetch('/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id})}),j=await r.json();m.textContent=j.error||j.message;if(r.status===401)location.href='/cuenta-login.html';};load()</script></body></html>
