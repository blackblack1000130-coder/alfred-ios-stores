<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar compra · ALFRED IOS STORES</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#123b62,#040910 48%);color:#fff;font-family:Inter,system-ui,Arial}.wrap{width:min(650px,92%);margin:0 auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.back{color:#d7f4ff;text-decoration:none;border:1px solid #2a5774;background:#091a2a;padding:10px 14px;border-radius:11px;font-weight:900}.box{padding:26px;border:1px solid #2b6088;background:#081522ee;border-radius:24px;box-shadow:0 25px 80px #0009}.tag{color:#5dd4ff;font-size:12px;font-weight:900;letter-spacing:1px}.product{margin:18px 0;padding:18px;border:1px solid #1e4968;border-radius:17px;background:#04101a}.product h1{margin:5px 0 10px}.price{font-size:38px;color:#57d5ff;font-weight:1000}.muted{color:#94aabd;line-height:1.5}.buy{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#087eff,#00baff);color:#fff;font-weight:1000;font-size:16px;cursor:pointer}.buy:disabled{opacity:.65}.success{display:none;text-align:center;padding:22px;border:1px solid #236c54;background:#061a15;border-radius:17px}.success.show{display:block}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;vertical-align:-4px;margin-right:8px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bottom-back{display:block;width:max-content;margin:18px auto 0;padding:11px 18px;border:1px solid #2b668b;border-radius:12px;color:#d9efff;text-decoration:none;background:#071a2a;font-weight:800}.bottom-back:hover{background:#0d2943}</style></head><body><main class="wrap"><div class="top"><b>ALFRED <span style="color:#20baff">IOS STORES</span></b></div><section class="box"><div class="tag">CONFIRMAR COMPRA</div><div id="p" class="product">Cargando producto...</div><button id="buy" class="buy">Confirmar compra</button><div id="success" class="success"><div style="font-size:42px">✅</div><h2>¡Compra confirmada!</h2><p class="muted">Tu pedido fue registrado correctamente. Cuando tus archivos estén listos, <b>te esperarán en tu cuenta</b>.</p><a class="buy" style="display:inline-block;text-decoration:none;margin-top:8px" href="/cuenta.html">Ver mis compras</a></div><p id="m" class="muted"></p></section><a class="back bottom-back" href="/">← Volver a la tienda</a></main><script>const id=new URLSearchParams(location.search).get('product')||new URLSearchParams(location.search).get('id'),pEl=document.getElementById('p'),buy=document.getElementById('buy'),m=document.getElementById('m'),success=document.getElementById('success');function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}async function load(){const r=await fetch('/api/products');const p=await r.json();const x=p.find(a=>String(a.id)===String(id));if(!x){pEl.innerHTML='<b>Producto no encontrado.</b>';buy.disabled=true;return}pEl.innerHTML='<h1>'+esc(x.name)+'</h1><p class="muted">'+esc(x.description||'Producto digital para iPhone.')+'</p><div class="price">US$'+Number(x.price).toLocaleString('en-US')+'</div><p class="muted">Revisa el producto y confirma la compra con tu saldo disponible.</p>'}buy.onclick=async()=>{buy.disabled=true;buy.innerHTML='<span class="spinner"></span>Procesando compra...';m.textContent='';try{const r=await fetch('/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id})});const j=await r.json();if(r.status===401){location.href='/cuenta-login.html';return}if(!r.ok){m.textContent=j.error||'No se pudo completar la compra.';buy.disabled=false;buy.textContent='Confirmar compra';return}success.classList.add('show');buy.style.display='none';m.textContent=''}catch(e){m.textContent='No se pudo conectar con el servidor.';buy.disabled=false;buy.textContent='Confirmar compra'}};load();</script></body></html>
