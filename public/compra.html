<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar compra · ALFRED IOS STORES</title><style>*{box-sizing:border-box}body{margin:0;background:#050505 url('/assets/alfred-ios-stores-luxury-bg.png') center top/cover fixed no-repeat}.wrap{width:min(650px,92%);margin:0 auto;padding:18px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.back{color:#d7f4ff;text-decoration:none;border:1px solid #2a5774;background:#091a2a;padding:10px 14px;border-radius:11px;font-weight:900}.box{padding:20px;border:1px solid #2b6088;background:#081522ee;border-radius:24px;box-shadow:0 25px 80px #0009}.tag{color:#5dd4ff;font-size:12px;font-weight:900;letter-spacing:1px}.product{margin:18px 0;padding:18px;border:1px solid #1e4968;border-radius:17px;background:#04101a}.product h1{margin:5px 0 10px}.price{font-size:38px;color:#57d5ff;font-weight:1000}.muted{color:#94aabd;line-height:1.5}.cartbtn{width:100%;padding:12px;border:1px solid #705522;border-radius:12px;background:#0b0b0b;color:#f7d36d;font-weight:950;font-size:15px;cursor:pointer;margin-top:8px}.buy{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#087eff,#00baff);color:#fff;font-weight:1000;font-size:16px;cursor:pointer}.buy:disabled{opacity:.65}.success{display:none;text-align:center;padding:22px;border:1px solid #236c54;background:#061a15;border-radius:17px}.success.show{display:block}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;vertical-align:-4px;margin-right:8px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.bottom-back{border:1px solid #2b668b;cursor:pointer;font:inherit;display:block;width:max-content;margin:18px auto 0;padding:11px 18px;border:1px solid #2b668b;border-radius:12px;color:#d9efff;text-decoration:none;background:#071a2a;font-weight:800}.bottom-back:hover{background:#0d2943}body:before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(247,201,75,.10),transparent 28%),rgba(0,0,0,.18);z-index:-1;pointer-events:none}</style></head><body><main class="wrap"><div class="top"><b>ALFRED <span style="color:#20baff">IOS STORES</span></b><span id="balanceTop" style="color:#5ed1ff;font-weight:900;font-size:13px"></span></div><section class="box"><div class="tag">CONFIRMAR COMPRA</div><div id="p" class="product">Cargando producto...</div><button id="addCart" class="cartbtn">🛒 Agregar al carrito</button><button id="buy" class="buy">Comprar ahora</button><div id="success" class="success"><div style="font-size:42px">✅</div><h2>¡Compra confirmada!</h2><p class="muted">Tu compra fue confirmada y <b>tus archivos ya están disponibles en tu cuenta</b>.</p><a class="buy" style="display:inline-block;text-decoration:none;margin-top:8px" href="/cuenta.html">Ver mis compras</a></div><p id="m" class="muted"></p></section><button class="back bottom-back" type="button" onclick="goBack()">← Volver atrás</button></main><script>function goBack(){if(history.length>1)history.back();else location.href='/'}const id=new URLSearchParams(location.search).get('product')||new URLSearchParams(location.search).get('id'),pEl=document.getElementById('p'),buy=document.getElementById('buy'),m=document.getElementById('m'),success=document.getElementById('success');function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}async function load(){const r=await fetch('/api/products');const p=await r.json();const x=p.find(a=>String(a.id)===String(id));if(!x){pEl.innerHTML='<b>Producto no encontrado.</b>';buy.disabled=true;return}pEl.innerHTML='<h1>'+esc(x.name)+'</h1><p class="muted">'+esc(x.description||'Producto digital para iPhone.')+'</p><div class="price">US$'+Number(x.price).toLocaleString('en-US')+'</div><p class="muted">Revisa el producto y confirma la compra con tu saldo disponible.</p>'}document.getElementById('addCart').onclick=()=>{let c=JSON.parse(localStorage.getItem('alfred_cart')||'[]');if(!c.includes(Number(id)))c.push(Number(id));localStorage.setItem('alfred_cart',JSON.stringify(c));document.getElementById('addCart').textContent='✓ Agregado al carrito';setTimeout(()=>location.href='/cart.html',500)};buy.onclick=async()=>{buy.disabled=true;buy.innerHTML='<span class="spinner"></span>Procesando compra...';m.textContent='';try{const r=await fetch('/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:id})});const j=await r.json();if(r.status===401){location.href='/cuenta-login.html';return}if(!r.ok){m.textContent=j.error||'No se pudo completar la compra.';buy.disabled=false;buy.textContent='Confirmar compra';return}success.classList.add('show');buy.style.display='none';m.textContent=''}catch(e){m.textContent='No se pudo conectar con el servidor.';buy.disabled=false;buy.textContent='Confirmar compra'}};load();(async()=>{try{const r=await fetch('/api/me',{cache:'no-store'});if(r.ok){const u=await r.json();document.getElementById('balanceTop').textContent='Saldo: US$'+Number(u.balance||0).toLocaleString('en-US')}}catch(e){}})();</script></body></html>
